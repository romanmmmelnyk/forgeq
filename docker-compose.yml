services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forgeq
      POSTGRES_PASSWORD: forgeq
      POSTGRES_DB: forgeq
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeq"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
